<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Chithi - Chaupal Document Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .mic-active { background-color: #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden p-6 mb-8">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-1">Master Chithi</h1>
        <p class="text-center text-xs text-slate-500 mb-6">चौपाल दस्तावेज़ जनरेटर (Voice + Touch Ready)</p>

        <!-- Language Selector -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-600 mb-1">भाषा चुनें (Language)</label>
            <select id="langSelect" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50">
                <option value="hi-IN">हिन्दी (Hindi)</option>
                <option value="en-IN">English</option>
            </select>
        </div>

        <!-- Document Type Selector -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-600 mb-1">दस्तावेज़ चुनें (Document Type)</label>
            <select id="docSelect" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-900" onchange="buildForm()">
                <option value="marriage">1. Marriage Biodata (शादी बायोडाटा)</option>
                <option value="rent">2. Rent Agreement (किरायानामा)</option>
                <option value="application">3. General Application (सामान्य आवेदन)</option>
            </select>
        </div>

        <!-- Dynamic Form Fields Container -->
        <div id="formContainer" class="space-y-4 mb-6">
            <!-- Fields generated dynamically -->
        </div>

        <!-- Action Button -->
        <button onclick="generatePDF()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition">
            PDF डाउनलोड करें (Download PDF)
        </button>
    </div>

    <!-- Hidden PDF Template -->
    <div id="pdfContent" class="hidden p-8 bg-white text-slate-900">
        <h2 id="pdfTitle" class="text-xl font-bold mb-6 text-center text-indigo-600 border-b pb-2"></h2>
        <div id="pdfBody" class="space-y-3 text-sm"></div>
    </div>

    <script>
        const templates = {
            marriage: {
                title: "शादी बायोडाटा (Marriage Biodata)",
                fields: ["लड़के/लड़की का पूरा नाम", "पिता का नाम", "माता का नाम", "जन्म तिथि व समय", "शिक्षा (Education)", "गोत्र / मूल", "वर्तमान पता"]
            },
            rent: {
                title: "किरायानामा (Rent Agreement)",
                fields: ["मकान मालिक का नाम", "किरायेदार का नाम", "मासिक किराया (रुपये में)", "दुकान/मकान का पूरा पता", "अनुबंध की अवधि (महीने)"]
            },
            application: {
                title: "सामान्य आवेदन (General Application)",
                fields: ["आवेदक का नाम", "पिता/पति का नाम", "ग्राम पंचायत व ब्लॉक", "समस्या या विषय का विवरण"]
            }
        };

        function buildForm() {
            const docKey = document.getElementById('docSelect').value;
            const container = document.getElementById('formContainer');
            container.innerHTML = "";
            
            templates[docKey].fields.forEach((field, index) => {
                container.innerHTML += `
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">${index + 1}. ${field}</label>
                        <div class="flex gap-2">
                            <input type="text" id="field_${index}" placeholder="टाइप करें..." class="flex-1 p-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500">
                            <button type="button" onclick="startVoiceInput(${index})" id="mic_${index}" class="px-3 bg-slate-200 hover:bg-indigo-100 text-slate-700 rounded-lg text-xs font-semibold transition flex items-center justify-center">
                                🎤 माइक
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function startVoiceInput(index) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("आपका ब्राउज़र वॉइस रिकग्निशन सपोर्ट नहीं करता। कृपया सीधे टाइप करें।");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('langSelect').value;
            recognition.interimResults = false;

            const micBtn = document.getElementById(`mic_${index}`);
            micBtn.classList.add('mic-active');
            micBtn.innerText = "सुन रहा है...";

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById(`field_${index}`).value = text;
                resetMicState(micBtn);
            };

            recognition.onerror = function() {
                resetMicState(micBtn);
            };

            recognition.onend = function() {
                resetMicState(micBtn);
            };

            try {
                recognition.start();
            } catch (e) {
                resetMicState(micBtn);
            }
        }

        function resetMicState(btn) {
            btn.classList.remove('mic-active');
            btn.innerText = "🎤 माइक";
        }

        function generatePDF() {
            const docKey = document.getElementById('docSelect').value;
            const template = templates[docKey];
            
            let content = "";
            template.fields.forEach((field, index) => {
                const val = document.getElementById(`field_${index}`).value || "लागू नहीं";
                content += `<p style="margin-bottom: 10px;"><strong style="color: #4f46e5; width: 40%; display: inline-block;">${field}:</strong> <span>${val}</span></p>`;
            });

            document.getElementById('pdfTitle').innerText = template.title;
            document.getElementById('pdfBody').innerHTML = content;

            const element = document.getElementById('pdfContent');
            element.classList.remove('hidden');

            html2pdf().from(element).set({
                margin: 10,
                filename: `${docKey}-master-chithi.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save().then(() => {
                element.classList.add('hidden');
            });
        }

        window.onload = buildForm;
    </script>
</body>
</html>
इस फाइल को सेव करके गिट पर कमिट और पुश कर दीजिए। इसके
